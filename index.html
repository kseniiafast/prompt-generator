<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Prompt Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090f; --surface: #12121e; --surface2: #1c1c2e; --border: #2a2a42;
      --accent: #7c3aed; --accent-h: #6d28d9; --green: #10b981; --red: #ef4444;
      --teal: #0ea5e9; --text: #e2e8f0; --muted: #7b8499;
      --chip-bg: #1e1e32; --chip-on: #4c1d95; --chip-brd: #3b3b5c;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: linear-gradient(135deg, #1a0533 0%, #0f0f2e 60%, #0a1628 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 28px; display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    header h1 { font-size: 1.35rem; font-weight: 700; background: linear-gradient(90deg,#a78bfa,#60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    header p { color: var(--muted); font-size: .8rem; margin-top: 2px; }
    .mode-toggle { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
    .mode-toggle button { border: none; background: transparent; color: var(--muted); font-family: inherit; font-size: .8rem; font-weight: 500; padding: 7px 15px; border-radius: 7px; cursor: pointer; transition: all .2s; white-space: nowrap; }
    .mode-toggle button.active { background: var(--accent); color: #fff; }
    main { max-width: 1360px; margin: 0 auto; padding: 22px 20px 60px; display: grid; grid-template-columns: 1fr 400px; gap: 20px; }
    @media (max-width: 1020px) { main { grid-template-columns: 1fr; } }
    .model-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
    .model-tab { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-family: inherit; font-size: .76rem; font-weight: 500; padding: 6px 13px; border-radius: 8px; cursor: pointer; transition: all .2s; }
    .model-tab:hover { border-color: var(--accent); color: var(--text); }
    .model-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .model-tab .badge { font-size: .6rem; background: rgba(255,255,255,.18); padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
    .field-label { display: block; font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
    .subject-wrap { margin-bottom: 16px; }
    .subject-wrap textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: .9rem; padding: 11px 13px; resize: vertical; min-height: 70px; outline: none; transition: border-color .2s; }
    .subject-wrap textarea:focus { border-color: var(--accent); }
    .subject-wrap textarea::placeholder { color: var(--muted); }
    .translate-status { font-size: .7rem; margin-top: 5px; height: 14px; color: transparent; transition: color .2s; }
    .translate-status.translating { color: var(--teal); }
    .translate-status.done { color: var(--green); }
    .translate-status.error { color: var(--red); }
    .categories { display: flex; flex-direction: column; gap: 11px; }
    .cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; transition: border-color .2s; }
    .cat-card:hover { border-color: #3d3d60; }
    .cat-card.video-only { display: none; }
    body.mode-video .cat-card.video-only { display: block; }
    .cat-card.edit-only { display: none; }
    body.mode-edit .cat-card.edit-only { display: block; }
    body.mode-edit .cat-card:not(.edit-only) { display: none; }
    .cat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .cat-icon { font-size: .9rem; }
    .cat-title { font-size: .74rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .cat-badge { font-size: .65rem; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 1px 7px; border-radius: 10px; margin-left: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--chip-brd); background: var(--chip-bg); color: #a0aec0; font-family: inherit; font-size: .77rem; padding: 5px 11px; border-radius: 20px; cursor: pointer; transition: all .15s; user-select: none; }
    .chip:hover { border-color: var(--accent); color: var(--text); }
    .chip.on { background: var(--chip-on); border-color: #7c3aed; color: #d8b4fe; }
    .extra-textarea { width: 100%; background: var(--chip-bg); border: 1px solid var(--chip-brd); border-radius: 8px; color: var(--text); font-family: inherit; font-size: .8rem; padding: 9px 12px; resize: vertical; min-height: 58px; outline: none; margin-top: 10px; transition: border-color .2s; }
    .extra-textarea:focus { border-color: var(--accent); }
    .extra-textarea::placeholder { color: var(--muted); }
    .ref-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 11px; overflow: hidden; }
    body.mode-edit .ref-section { display: none; }
    .ref-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 15px; cursor: pointer; user-select: none; }
    .ref-header-left { display: flex; align-items: center; gap: 8px; }
    .ref-title { font-size: .74rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .ref-arrow { color: var(--muted); font-size: .75rem; transition: transform .2s; }
    .ref-section.open .ref-arrow { transform: rotate(180deg); }
    .ref-body { display: none; padding: 0 14px 14px; }
    .ref-section.open .ref-body { display: block; }
    .ref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .ref-grid { grid-template-columns: 1fr; } }
    .ref-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 11px; }
    .ref-item-title { font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .upload-zone { border: 1.5px dashed var(--chip-brd); border-radius: 7px; padding: 10px; text-align: center; cursor: pointer; transition: border-color .2s; margin-bottom: 7px; position: relative; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .upload-zone:hover { border-color: var(--accent); }
    .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-hint { font-size: .7rem; color: var(--muted); pointer-events: none; }
    .ref-thumb { width: 100%; max-height: 70px; object-fit: cover; border-radius: 5px; display: none; pointer-events: none; }
    .ref-thumb.show { display: block; }
    .ref-fname { font-size: .65rem; color: var(--teal); display: none; pointer-events: none; }
    .ref-fname.show { display: block; }
    .ref-desc { width: 100%; background: var(--chip-bg); border: 1px solid var(--chip-brd); border-radius: 6px; color: var(--text); font-family: inherit; font-size: .75rem; padding: 7px 9px; resize: none; min-height: 46px; outline: none; transition: border-color .2s; }
    .ref-desc:focus { border-color: var(--accent); }
    .ref-desc::placeholder { color: var(--muted); }
    .sidebar { display: flex; flex-direction: column; gap: 14px; }
    .prompt-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; position: sticky; top: 20px; }
    .prompt-card-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid var(--border); background: var(--surface2); }
    .prompt-card-top span { font-size: .73rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .char-count { font-size: .7rem; color: var(--muted); }
    #prompt-out { font-family: 'JetBrains Mono', monospace; font-size: .73rem; line-height: 1.75; color: #c4d0e8; padding: 14px 15px; min-height: 280px; max-height: 580px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
    #prompt-out.empty { font-family: 'Inter', sans-serif; font-size: .85rem; color: var(--muted); font-style: italic; display: flex; align-items: center; justify-content: center; min-height: 280px; text-align: center; padding: 30px 20px; }
    .prompt-btns { display: flex; gap: 8px; padding: 11px 14px; border-top: 1px solid var(--border); background: var(--surface2); }
    .btn { flex: 1; border: none; border-radius: 8px; font-family: inherit; font-size: .79rem; font-weight: 600; padding: 9px 12px; cursor: pointer; transition: all .2s; }
    .btn-copy { background: var(--accent); color: #fff; }
    .btn-copy:hover { background: var(--accent-h); }
    .btn-copy.copied { background: var(--green); }
    .btn-reset { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    .btn-reset:hover { border-color: var(--red); color: var(--red); }
    .tips-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .tips-card h3 { font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 9px; }
    .tip { font-size: .75rem; color: var(--muted); line-height: 1.65; display: none; }
    .tip.on { display: block; }
    .tip strong { color: #a78bfa; }
    .tip code { background: var(--surface2); padding: 1px 5px; border-radius: 3px; font-size: .7rem; color: #67e8f9; font-family: 'JetBrains Mono', monospace; }
    .pl { color: #818cf8; font-weight: 600; }
    .pv { color: #e2e8f0; }
    .ps { color: #f0f9ff; }
    .pb { color: #34d399; }
    .pp { color: #60a5fa; }
    .pe { color: #f87171; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--green); color: #fff; font-size: .82rem; font-weight: 600; padding: 10px 18px; border-radius: 9px; transform: translateY(60px); opacity: 0; transition: all .3s cubic-bezier(.34,1.56,.64,1); pointer-events: none; z-index: 999; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .subcat { margin-bottom: 10px; }
    .subcat:last-child { margin-bottom: 0; }
    .subcat-label { font-size: .67rem; font-weight: 600; color: #4d5468; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; padding-left: 2px; }
    .chip-more { border-color: #a78bfa; color: #a78bfa; }
    .chip-more:hover { background: rgba(167,139,250,.12); color: #c4b5fd; }
    .chips-more { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chips-more.hidden { display: none; }
    .btn-edit-toggle { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: .85rem; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; padding: 0; }
    .btn-edit-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .btn-edit-toggle.active { border-color: var(--accent); color: var(--accent); background: rgba(124,58,237,.15); }
    #prompt-edit { font-family: 'JetBrains Mono',monospace; font-size:.73rem; line-height:1.75; color:var(--text); background:transparent; border:none; padding:14px 15px; width:100%; min-height:280px; max-height:580px; overflow-y:auto; resize:none; outline:none; display:none; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>✦ AI Prompt Generator</h1>
    <p>Nano Bano 2 · GPT Image 2 · Kling · Midjourney · Stable Diffusion · DALL-E 3 · Flux</p>
  </div>
  <div class="mode-toggle">
    <button id="btn-image" class="active" onclick="setMode('image')">🖼 Image</button>
    <button id="btn-video" onclick="setMode('video')">🎬 Video</button>
    <button id="btn-edit"  onclick="setMode('edit')">✏️ Edit Photo</button>
  </div>
</header>

<main>
  <div>
    <div class="model-tabs" id="model-tabs"></div>
    <div class="subject-wrap">
      <label class="field-label" id="subject-label">Subject / Scene Description</label>
      <textarea id="subject" placeholder="Type in any language — auto-translated to English in the prompt..." rows="3" oninput="onSubjectInput()"></textarea>
      <div class="translate-status" id="xlat-status"></div>
    </div>
    <div class="ref-section" id="ref-section">
      <div class="ref-header" onclick="document.getElementById('ref-section').classList.toggle('open')">
        <div class="ref-header-left">
          <span style="font-size:.9rem">📎</span>
          <span class="ref-title">References &amp; Assets</span>
          <span style="font-size:.7rem;color:var(--muted);margin-left:8px">composition · product · logo · style</span>
        </div>
        <span class="ref-arrow">▼</span>
      </div>
      <div class="ref-body">
        <div class="ref-grid" id="ref-grid"></div>
      </div>
    </div>
    <div class="categories" id="categories"></div>
  </div>
  <div class="sidebar">
    <div class="prompt-card">
      <div class="prompt-card-top">
        <span id="prompt-label">Generated Prompt</span>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn-edit-toggle" id="btn-edit-toggle" onclick="toggleEditMode()" title="Manually edit the prompt">✏️</button>
          <span class="char-count" id="char-count">0 chars</span>
        </div>
      </div>
      <div id="prompt-out" class="empty">Select parameters on the left — your prompt will appear here...</div>
      <textarea id="prompt-edit" placeholder="Edit your prompt manually here..." oninput="document.getElementById('char-count').textContent=this.value.length+' chars'"></textarea>
      <div class="prompt-btns">
        <button class="btn btn-copy" id="btn-copy" onclick="copyPrompt()">Copy Prompt</button>
        <button class="btn btn-reset" onclick="resetAll()">Reset All</button>
      </div>
    </div>
    <div class="tips-card">
      <h3>Model Tips</h3>
      <div id="tips-wrap"></div>
    </div>
  </div>
</main>
<div class="toast" id="toast">Copied to clipboard!</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// MODELS
// ═══════════════════════════════════════════════════════════════════════
const MODELS = [
  { id:'universal',   label:'Universal',        badge:null,
    tip:'<strong>Universal</strong> — balanced structured prompt that works across most AI models. Good when unsure which model to use.' },
  { id:'nano-bano',   label:'Nano Bano 2',       badge:'new',
    tip:'<strong>Nano Bano 2</strong> — responds well to structured keyword blocks. Artistic and stylistic descriptors in sequence work best.' },
  { id:'gpt-image',   label:'GPT Image 2',       badge:null,
    tip:'<strong>GPT Image 2</strong> — best with natural language sentences. Describe details narratively. Full sentences outperform tag lists.' },
  { id:'kling',       label:'Kling',             badge:'video',
    tip:'<strong>Kling</strong> — specialized for video. Always specify camera movement and scene dynamics. Use <strong>Video</strong> mode for best results.' },
  { id:'midjourney',  label:'Midjourney',        badge:null,
    tip:'<strong>Midjourney</strong> — uses suffixes <code>--ar</code> <code>--v 6.1</code> <code>--style raw</code>. Comma-separated keywords. No articles needed.' },
  { id:'stable-diff', label:'Stable Diffusion',  badge:null,
    tip:'<strong>Stable Diffusion</strong> — supports weight tags <code>(keyword:1.3)</code>. Put quality markers first. Use img2img for photo editing.' },
  { id:'dalle3',      label:'DALL-E 3',          badge:null,
    tip:'<strong>DALL-E 3</strong> — understands natural language well. Use "a photograph of…" phrasing. Full descriptive sentences work best.' },
  { id:'flux',        label:'Flux',              badge:null,
    tip:'<strong>Flux</strong> — hybrid of tags and natural language. Lighting details and quality descriptors improve output significantly.' },
];

// ═══════════════════════════════════════════════════════════════════════
// CATEGORIES  — each option: { l: 'display label', v: 'full prompt text' }
// ═══════════════════════════════════════════════════════════════════════
const CATS = [
  { id:'style', icon:'🎨', title:'Style', video:false, edit:false, pinCount:2, opts:[
    {l:'Photorealism',     v:'ultra-realistic photographic rendering, indistinguishable from a real photograph, accurate textures and materials, true-to-life colors and proportions'},
    {l:'3D Render',        v:'photorealistic 3D computer graphics, subsurface scattering, ray-traced lighting, smooth surfaces, Octane or Arnold render quality'},
    {l:'Anime',            v:'Japanese anime animation style, clean cel-shaded lines, large expressive eyes, vibrant flat colors, stylized proportions'},
    {l:'Manga',            v:'black and white Japanese manga illustration, bold confident ink lines, high contrast, screen tones, dynamic panel energy'},
    {l:'Oil Painting',     v:'textured oil paint brushstrokes, rich impasto technique, layered pigments on canvas, classical painting aesthetic, canvas grain visible'},
    {l:'Watercolor',       v:'transparent watercolor washes, soft bleeding edges, paper texture visible, delicate color gradients, spontaneous fluid marks'},
    {l:'Digital Art',      v:'polished professional digital illustration, clean lines, smooth gradients, refined digital brushwork, concept art quality'},
    {l:'Cinematic',        v:'cinematic widescreen aesthetic, film-grade color grading, movie still quality, dramatic depth of field, professional cinematography'},
    {l:'Concept Art',      v:'professional concept art for film or games, detailed environment or character design, painted illustration with descriptive visual clarity'},
    {l:'Pixel Art',        v:'retro pixel art aesthetic, 8-bit or 16-bit style, limited color palette, chunky visible pixels, nostalgic video game feel'},
    {l:'Illustration',     v:'editorial-style illustration, graphic and clean, professional book or magazine quality, expressive hand-drawn aesthetic'},
    {l:'Retro / Vintage',  v:'aged vintage aesthetic, film grain and dust, faded desaturated color palette, retro design sensibility, nostalgic character'},
    {l:'Minimalism',       v:'minimalist composition, generous empty space, simple geometric forms, reduced color palette, elegant visual restraint'},
    {l:'Surrealism',       v:'dreamlike surrealist imagery, impossible juxtapositions, Dalí-inspired visual logic, subconscious symbolism, metaphysical dreamscape'},
    {l:'Pop Art',          v:'bold Pop Art style, flat bright colors, Ben-Day dot patterns, graphic outlines, Warhol or Lichtenstein aesthetic'},
    {l:'Noir',             v:'film noir aesthetic, heavy shadows, venetian blind light patterns, moody cynical atmosphere, extreme chiaroscuro contrast'},
    {l:'Hyperrealism',     v:'extreme hyperrealistic detail surpassing photography, every pore and texture and fiber rendered with obsessive surgical precision'},
    {l:'Line Art',         v:'clean precise line art, confident single-weight or varied-weight ink lines, minimal shading, graphic architectural quality'},
    {l:'Impressionism',    v:'loose visible brushstrokes in impressionist style, capturing light and movement over strict form, Monet or Renoir inspired palette'},
  ]},

  { id:'lighting', icon:'💡', title:'Lighting', video:false, edit:false, groups:[
    { sub:'Time & Light Source', opts:[
      {l:'Golden Hour',        v:'warm golden sunlight at low sun angle, long soft shadows, amber and honey tones, magical cinematic atmosphere just after sunrise or before sunset'},
      {l:'Blue Hour',          v:'cool blue twilight light just before sunrise or after sunset, soft diffused illumination, deep blue sky gradients, tranquil melancholic tone'},
      {l:'Natural Daylight',   v:'clean natural outdoor daylight, balanced exposure, soft diffused open-sky fill light, true-to-life colors, no artificial sources'},
      {l:'Studio',             v:'controlled professional studio lighting, clean specular catch lights, perfect exposure, neutral background, product and portrait photography quality'},
      {l:'Neon',               v:'vibrant neon light, electric pinks and blues and greens, colored light spill on wet surfaces, nighttime urban glow, cyberpunk atmosphere'},
      {l:'Candlelight / Fire', v:'warm flickering candlelight or firelight, orange and amber glow, low-key intimate atmosphere, dancing light on surrounding surfaces'},
      {l:'Street Lamp',        v:'warm tungsten street lamp illumination, isolated pool of warm light in surrounding darkness, urban nighttime atmosphere, film noir quality'},
      {l:'Moonlight',          v:'cool blue-white moonlight, soft directional night illumination, subtle long shadows, ethereal and mysterious nocturnal atmosphere'},
      {l:'Sun Rays',           v:'visible god rays and crepuscular rays of sunlight, volumetric light shafts through atmosphere or foliage, dramatic and divine quality'},
      {l:'Bokeh Light',        v:'out-of-focus background light circles, creamy bokeh quality, shallow depth of field, fairy-light aesthetic, dreamy luminous background'},
    ]},
    { sub:'Direction', opts:[
      {l:'Backlit (Contre-jour)', v:'strong backlight source directly behind subject, glowing rim light, silhouette effect, dramatic halo glow, lens flare potential, ethereal luminosity'},
      {l:'Side Light',            v:'strong side light raking across subject, creating half-shadow, sculptural three-dimensional form definition, dramatic depth'},
      {l:'Rim Light',             v:'bright rim light separating subject from background, glowing edge definition, professional portrait or product lighting separation technique'},
    ]},
    { sub:'Character & Effects', opts:[
      {l:'Soft Diffused', v:'large soft diffused light source, no harsh shadows, smooth gentle gradients across surfaces, flattering beauty lighting quality'},
      {l:'Hard & Sharp',  v:'small hard point light source, crisp sharp shadow edges, high contrast, dramatic chiaroscuro, strong directional single-source illumination'},
      {l:'Dramatic',      v:'extreme high-contrast dramatic lighting, deep impenetrable blacks, isolated hot highlights, theatrical and intense atmosphere, Rembrandt-style shadow play'},
      {l:'Cinematic',     v:'professional film set lighting, motivated key light with subtle fill, dramatic color gel accents, movie-quality lighting design'},
    ]},
  ]},

  { id:'lens', icon:'📷', title:'Lens / Camera', video:false, edit:false, opts:[
    {l:'24mm Wide',       v:'24mm wide-angle lens, expansive environmental context, slight edge perspective distortion, dramatic foreground-to-background depth'},
    {l:'35mm',            v:'35mm lens, classic photojournalistic perspective, natural field of view close to human eye, versatile street photography focal length'},
    {l:'50mm Standard',   v:'50mm standard lens, natural undistorted perspective perfectly matching human eye, honest and clean rendering of space'},
    {l:'85mm Portrait',   v:'85mm portrait lens, flattering facial compression, creamy background separation, classic professional portrait focal length'},
    {l:'135mm Telephoto', v:'135mm telephoto lens, strong background compression, clean subject isolation, painterly shallow depth of field'},
    {l:'200mm+',          v:'super-telephoto focal length, extreme background compression, subject isolation across distance, wildlife and sports photography quality'},
    {l:'Macro',           v:'extreme macro close-up lens, life-size or greater magnification, razor-thin depth of field, revealing microscopic detail and texture invisible to the naked eye'},
    {l:'Fisheye',         v:'ultra-wide fisheye lens, 180-degree field of view, strong barrel distortion, dynamic circular perspective, extreme environmental depth'},
    {l:'Tilt-shift',      v:'tilt-shift lens effect, selective tilted focus plane, miniaturization effect, architectural precision with dreamy foreground and background defocus'},
    {l:'Cinema Lens',     v:'professional cinema anamorphic lens, characteristic oval bokeh, subtle horizontal lens flares, widescreen aspect ratio, film-grade optics'},
    {l:'DSLR',            v:'full-frame DSLR camera rendering, professional photographic quality, natural dynamic range, optical lens character and color science'},
    {l:'35mm Film Grain', v:'authentic 35mm film photography grain, subtle organic noise texture, slightly imperfect exposure, nostalgic analog film stock aesthetic'},
    {l:'Medium Format',   v:'medium format camera quality, exceptional resolution and tonal richness, luminous smooth transitions, luxury fashion and editorial photography standard'},
    {l:'Vintage Camera',  v:'vintage analog camera aesthetic, soft optical imperfections, color shift, natural vignette, aged film stock quality, nostalgic imperfect character'},
    {l:'Drone / Aerial',  v:'drone aerial photography perspective, elevated bird\'s-eye viewpoint, sweeping landscape scale, liberated aerial composition'},
  ]},

  { id:'mood', icon:'🌀', title:'Mood / Atmosphere', video:false, edit:false, opts:[

// ═══════════════════════════════════════════════════════════════════════
// STATE  —  sel uses Map(label → fullValue) so chips show short name
// ═══════════════════════════════════════════════════════════════════════
let currentModel = 'universal';
let currentMode  = 'image';
const sel = {};
CATS.forEach(c => { sel[c.id] = new Map(); });
const refState = {};
REFS.forEach(r => { refState[r.id] = { name:'', desc:'' }; });
let translatedSubject = '';
let xlatTimer = null;
let editAddl = '';
let manualEdit = false;

// ═══════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════
function init() {
  renderModelTabs();
  renderRefs();
  renderCategories();
  renderTips();
  rebuild();
}

function renderModelTabs() {
  document.getElementById('model-tabs').innerHTML = MODELS.map(m =>
    `<button class="model-tab${m.id===currentModel?' active':''}" onclick="setModel('${m.id}')">
       ${m.label}${m.badge?`<span class="badge">${m.badge}</span>`:''}
     </button>`).join('');
}

function renderRefs() {
  document.getElementById('ref-grid').innerHTML = REFS.map(r => `
    <div class="ref-item">
      <div class="ref-item-title">${r.label}</div>
      <div class="upload-zone">
        <input type="file" accept="image/*" onchange="onRefUpload('${r.id}',this)">
        <img  class="ref-thumb" id="${r.id}-thumb" src="" alt="">
        <span class="ref-fname" id="${r.id}-fname"></span>
        <span class="upload-hint" id="${r.id}-hint">Click to upload image</span>
      </div>
      <textarea class="ref-desc" id="${r.id}-desc" placeholder="${r.ph}" rows="2"
        oninput="refState['${r.id}'].desc=this.value;rebuild()"></textarea>
    </div>`).join('');
}

function escAttr(s) { return s.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function renderCategories() {
  document.getElementById('categories').innerHTML = CATS.map(cat => {
    let chipsHtml;
    if (cat.groups) {
      chipsHtml = cat.groups.map(grp => `
        <div class="subcat">
          <div class="subcat-label">${grp.sub}</div>
          <div class="chips">${grp.opts.map(o =>
            `<button class="chip" data-v="${escAttr(o.v)}" onclick="toggleChip('${cat.id}',this)">${o.l}</button>`
          ).join('')}</div>
        </div>`).join('');
    } else if (cat.pinCount) {
      const pinned = cat.opts.slice(0, cat.pinCount);
      const more   = cat.opts.slice(cat.pinCount);
      chipsHtml = `
        <div class="chips">
          ${pinned.map(o => `<button class="chip" data-v="${escAttr(o.v)}" onclick="toggleChip('${cat.id}',this)">${o.l}</button>`).join('')}
          <button class="chip chip-more" onclick="toggleMore('${cat.id}')">More ▼</button>
        </div>
        <div class="chips chips-more hidden" id="chips-${cat.id}-more">
          ${more.map(o => `<button class="chip" data-v="${escAttr(o.v)}" onclick="toggleChip('${cat.id}',this)">${o.l}</button>`).join('')}
        </div>`;
    } else {
      chipsHtml = `<div class="chips">${cat.opts.map(o =>
        `<button class="chip" data-v="${escAttr(o.v)}" onclick="toggleChip('${cat.id}',this)">${o.l}</button>`
      ).join('')}</div>`;
    }
    return `<div class="cat-card${cat.video?' video-only':''}${cat.edit?' edit-only':''}" id="cat-${cat.id}">
      <div class="cat-header">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-title">${cat.title}</span>
        ${cat.badge?`<span class="cat-badge">${cat.badge}</span>`:''}
      </div>
      ${chipsHtml}
      ${cat.id==='preserve'
        ? `<textarea class="extra-textarea" id="edit-addl"
             placeholder="Additional edit instructions (optional)..."
             oninput="editAddl=this.value;rebuild()"></textarea>`
        : ''}
    </div>`;
  }).join('');
}

function toggleMore(catId) {
  const el  = document.getElementById(`chips-${catId}-more`);
  const btn = document.querySelector(`#cat-${catId} .chip-more`);
  el.classList.toggle('hidden');
  btn.textContent = el.classList.contains('hidden') ? 'More ▼' : 'Less ▲';
}

function renderTips() {
  document.getElementById('tips-wrap').innerHTML = MODELS.map(m =>
    `<div class="tip${m.id===currentModel?' on':''}" id="tip-${m.id}">${m.tip}</div>`).join('');
}

// ═══════════════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════════════
function setModel(id) {
  currentModel = id;
  document.querySelectorAll('.model-tab').forEach((b,i) => b.classList.toggle('active', MODELS[i].id===id));
  document.querySelectorAll('.tip').forEach(el => el.classList.toggle('on', el.id===`tip-${id}`));
  rebuild();
}

function setMode(mode) {
  currentMode = mode;
  ['image','video','edit'].forEach(m => document.getElementById(`btn-${m}`).classList.toggle('active', mode===m));
  document.body.className = `mode-${mode}`;
  const lbl = document.getElementById('subject-label');
  const ta  = document.getElementById('subject');
  if (mode === 'edit') {
    lbl.textContent = 'Original Photo Description';
    ta.placeholder  = 'Describe the original photo you want to edit...';
  } else {
    lbl.textContent = 'Subject / Scene Description';
    ta.placeholder  = 'Type in any language — auto-translated to English in the prompt...';
  }
  rebuild();
}

function toggleChip(catId, btn) {
  const label = btn.textContent.trim();
  const value = btn.dataset.v;
  if (sel[catId].has(label)) { sel[catId].delete(label); btn.classList.remove('on'); }
  else                       { sel[catId].set(label, value); btn.classList.add('on'); }
  rebuild();
}

function onRefUpload(id, input) {
  const file = input.files[0];
  if (!file) return;
  refState[id].name = file.name;
  const thumb = document.getElementById(`${id}-thumb`);
  const fname = document.getElementById(`${id}-fname`);
  const hint  = document.getElementById(`${id}-hint`);
  const reader = new FileReader();
  reader.onload = e => {
    thumb.src = e.target.result; thumb.classList.add('show');
    fname.textContent = file.name; fname.classList.add('show');
    hint.style.display = 'none';
    rebuild();
  };
  reader.readAsDataURL(file);
}

function resetAll() {
  if (manualEdit) {
    document.getElementById('prompt-edit').style.display = 'none';
    document.getElementById('prompt-out').style.display = '';
    document.getElementById('btn-edit-toggle').classList.remove('active');
    document.getElementById('btn-edit-toggle').title = 'Manually edit the prompt';
    manualEdit = false;
  }
  CATS.forEach(c => sel[c.id].clear());
  document.querySelectorAll('.chip.on').forEach(b => b.classList.remove('on'));
  document.getElementById('subject').value = '';
  translatedSubject = ''; editAddl = '';
  const addlEl = document.getElementById('edit-addl');
  if (addlEl) addlEl.value = '';
  document.getElementById('xlat-status').textContent = '';
  document.getElementById('xlat-status').className = 'translate-status';
  REFS.forEach(r => {
    refState[r.id] = { name:'', desc:'' };
    const thumb = document.getElementById(`${r.id}-thumb`);
    const fname = document.getElementById(`${r.id}-fname`);
    const hint  = document.getElementById(`${r.id}-hint`);
    const desc  = document.getElementById(`${r.id}-desc`);
    if (thumb) { thumb.src=''; thumb.classList.remove('show'); }
    if (fname) { fname.textContent=''; fname.classList.remove('show'); }
    if (hint)  hint.style.display = '';
    if (desc)  desc.value = '';
  });
  rebuild();
}

// ═══════════════════════════════════════════════════════════════════════
// TRANSLATION
// ═══════════════════════════════════════════════════════════════════════
function onSubjectInput() {
  const raw = document.getElementById('subject').value.trim();
  if (!raw || /^[\x00-\x7F\s]*$/.test(raw)) {
    translatedSubject = raw;
    document.getElementById('xlat-status').className = 'translate-status';
    rebuild(); return;
  }
  clearTimeout(xlatTimer);
  const st = document.getElementById('xlat-status');
  st.textContent = '⟳ Translating...'; st.className = 'translate-status translating';
  xlatTimer = setTimeout(() => doTranslate(raw), 750);
}

async function doTranslate(text) {
  const st = document.getElementById('xlat-status');
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`;
    const data = await (await fetch(url)).json();
    translatedSubject = data[0].map(x => x[0]).join('').trim();
    st.textContent = '✓ Translated to English'; st.className = 'translate-status done';
  } catch {
    translatedSubject = text;
    st.textContent = '⚠ Translation unavailable — using original text'; st.className = 'translate-status error';
  }
  rebuild();
}

// ═══════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════
// Returns full prompt values (not display labels) for a category
function g(id) { return [...sel[id].values()]; }

function getSubject() {
  const raw = document.getElementById('subject').value.trim();
  if (!raw) return '';
  if (/^[\x00-\x7F\s]*$/.test(raw)) return raw;
  return translatedSubject || raw;
}

function refsBlock() {
  return REFS.flatMap(r => {
    const d = refState[r.id];
    if (!d.name && !d.desc) return [];
    const lbl = r.label.replace(/^\S+\s/, '');
    let line = `• ${lbl}:`;
    if (d.name) line += ` [${d.name}]`;
    if (r.id === 'ref-comp') {
      line += ` Use ONLY the object placement and spatial composition from this reference — do NOT copy any style, lighting, colors, color palette, mood, textures, or aesthetic.`;
    }
    if (d.desc) line += ` ${d.desc}`;
    return [line];
  });
}

function hasContent() {
  return getSubject() || CATS.some(c => sel[c.id].size > 0)
    || REFS.some(r => refState[r.id].name || refState[r.id].desc);
}

function row(label, vals) {
  if (!vals || (Array.isArray(vals) ? !vals.length : !vals)) return [];
  return [`${label}: ${Array.isArray(vals) ? vals.join(', ') : vals}`];
}

// ═══════════════════════════════════════════════════════════════════════
// PROMPT BUILDERS
// ═══════════════════════════════════════════════════════════════════════
function rebuild() {
  if (manualEdit) return;
  const out = document.getElementById('prompt-out');
  if (!hasContent()) {
    out.innerHTML = currentMode==='edit'
      ? 'Select edit parameters on the left...'
      : 'Select parameters on the left — your prompt will appear here...';
    out.classList.add('empty'); out._raw = '';
    document.getElementById('char-count').textContent = '0 chars'; return;
  }
  const d = {
    subject: getSubject(),
    style:   g('style'),   lighting: g('lighting'),  lens:    g('lens'),
    mood:    g('mood'),    palette:  g('palette'),    comp:    g('composition'),
    details: g('details'), env:      g('environment'),time:    g('time'),
    weather: g('weather'), era:      g('era'),        quality: g('quality'),
    motion:  g('motion'),  camMove:  g('cam-move'),   pace:    g('pace'),
    eType:   g('edit-type'), eFrom:  g('edit-from'),  eTo:     g('edit-to'),
    intensity: g('intensity'), preserve: g('preserve'),
    refs: refsBlock(), addl: editAddl,
  };
  const isVid = currentMode==='video', isEdit = currentMode==='edit';
  let lines;
  if (isEdit) { lines = buildEdit(d); }
  else {
    const map = { 'midjourney':buildMJ,'stable-diff':buildSD,'gpt-image':buildGPT,
                  'dalle3':buildDALLE,'kling':buildKling,'flux':buildFlux,'nano-bano':buildNano };
    lines = (map[currentModel]||buildUniversal)(d, isVid);
  }
  const raw = lines.join('\n');
  out.innerHTML = colorize(lines);
  out.classList.remove('empty'); out._raw = raw;
  document.getElementById('char-count').textContent = `${raw.length} chars`;
}

function buildUniversal(d, vid) {
  const L = [];
  if (d.subject) { L.push('SUBJECT:', d.subject, ''); }
  L.push(...row('STYLE', d.style));
  L.push(...row('LIGHTING', d.lighting));
  L.push(...row('LENS / CAMERA', d.lens));
  L.push(...row('MOOD / ATMOSPHERE', d.mood));
  L.push(...row('COLOR PALETTE', d.palette));
  L.push(...row('COMPOSITION', d.comp));
  L.push(...row('DETAILS', d.details));
  L.push(...row('ENVIRONMENT', d.env));
  L.push(...row('TIME OF DAY', d.time));
  L.push(...row('WEATHER', d.weather));
  L.push(...row('ERA / PERIOD', d.era));
  if (vid) { L.push(...row('MOTION / DYNAMICS', d.motion)); L.push(...row('CAMERA MOVEMENT', d.camMove)); L.push(...row('PACE / DURATION', d.pace)); }
  L.push(...row('QUALITY', d.quality));
  if (d.refs.length) { L.push('', 'REFERENCES:'); d.refs.forEach(r => L.push(r)); }
  return L;
}

function buildMJ(d, vid) {
  const L = [];
  if (d.subject) { L.push('SUBJECT:', d.subject, ''); }
  L.push(...row('STYLE', d.style));
  L.push(...row('ENVIRONMENT', d.env));
  L.push(...row('TIME OF DAY', d.time));
  L.push(...row('WEATHER', d.weather));
  L.push(...row('ERA / PERIOD', d.era));
  L.push(...row('LIGHTING', d.lighting));
  L.push(...row('LENS / CAMERA', d.lens));
  L.push(...row('MOOD / ATMOSPHERE', d.mood));
  L.push(...row('COLOR PALETTE', d.palette));
  L.push(...row('COMPOSITION', d.comp));
  L.push(...row('DETAILS', d.details));
  if (vid) L.push(...row('MOTION', d.motion));
  L.push(...row('QUALITY', d.quality));
  if (d.refs.length) { L.push('', 'REFERENCES:'); d.refs.forEach(r => L.push(r)); }
  const p = ['--ar 16:9','--v 6.1'];
  if (d.style.some(s => /anim|manga/i.test(s))) p.push('--niji 6'); else p.push('--style raw');
  if (d.quality.some(q => /detail/i.test(q))) p.push('--q 2');
  L.push('', 'PARAMS:', p.join(' '));
  return L;
}

function buildSD(d, vid) {
  const L = [];
  if (d.subject) { L.push('SUBJECT:', d.subject, ''); }
  const qTags = d.quality.length ? d.quality.map(q=>`(${q}:1.4)`).join(', ') : '(masterpiece:1.4), (best quality:1.3)';
  L.push(`QUALITY TAGS: ${qTags}`);
  if (d.style.length) L.push(`STYLE: ${d.style.map(s=>`(${s}:1.2)`).join(', ')}`);
  L.push(...row('LIGHTING', d.lighting));
  L.push(...row('LENS / CAMERA', d.lens));
  L.push(...row('MOOD / ATMOSPHERE', d.mood));
  L.push(...row('COLOR PALETTE', d.palette));
  L.push(...row('COMPOSITION', d.comp));
  if (d.details.length) L.push(`DETAILS: ${d.details.map(x=>`(${x}:1.3)`).join(', ')}`);
  L.push(...row('ENVIRONMENT', d.env));
  L.push(...row('TIME OF DAY', d.time));
  L.push(...row('WEATHER', d.weather));
  L.push(...row('ERA / PERIOD', d.era));
  if (vid) L.push(...row('MOTION', d.motion));
  if (d.refs.length) { L.push('', 'REFERENCES:'); d.refs.forEach(r => L.push(r)); }
  return L;
}

function buildGPT(d, vid) {
  const L = [];
  const sty = d.style.length ? d.style.join(' and ')+' style' : 'photorealistic style';
  L.push('SUBJECT:', `A ${sty} ${vid?'video scene':'image'} of ${d.subject||'a scene'}.`, '');
  if (d.env.length||d.time.length||d.weather.length||d.era.length)
    L.push('SETTING:', [...d.env,...d.time,...d.weather,...d.era].join(', ')+'.');
  if (d.lighting.length) L.push('LIGHTING:', d.lighting.join(' and ')+' lighting.');
  if (d.mood.length)     L.push('MOOD / ATMOSPHERE:', d.mood.join(' and ')+'.');
  L.push(...row('COLOR PALETTE', d.palette));
  if (d.comp.length)     L.push('COMPOSITION:', d.comp.join(', ')+' composition.');
  if (d.lens.length)     L.push('LENS / CAMERA:', 'Shot with '+d.lens.join(', ')+'.');
  L.push(...row('DETAILS', d.details));
  if (vid) { L.push(...row('MOTION', d.motion)); L.push(...row('CAMERA MOVEMENT', d.camMove)); L.push(...row('PACE', d.pace)); }
  L.push(...row('QUALITY', d.quality));
  if (d.refs.length) { L.push('', 'REFERENCES:'); d.refs.forEach(r => L.push(r)); }
  return L;

  if (d.mood.length)     L.push('MOOD / ATMOSPHERE:', 'The atmosphere feels '+d.mood.join(' and ')+'.');
  L.push(...row('COLOR PALETTE', d.palette));
  if (d.lens.length)     L.push('LENS / CAMERA:', 'Captured using '+d.lens.join(', ')+'.');
  if (d.comp.length)     L.push('COMPOSITION:', d.comp.join(', ')+' composition.');
  L.push(...row('DETAILS', d.details));
  L.push(...row('QUALITY', d.quality));
  if (d.refs.length) { L.push('', 'REFERENCES:'); d.refs.forEach(r => L.push(r)); }

function buildFlux(d, vid) {
  const L = [];
  if (d.subject) { L.push('SUBJECT:', d.subject, ''); }
  L.push(...row('STYLE', d.style));
  L.push(...row('ENVIRONMENT', d.env));
  L.push(...row('TIME OF DAY', d.time));
  L.push(...row('WEATHER', d.weather));
  L.push(...row('ERA / PERIOD', d.era));
  L.push(...row('LIGHTING', d.lighting));
  L.push(...row('LENS / CAMERA', d.lens));
  L.push(...row('MOOD / ATMOSPHERE', d.mood));
  L.push(...row('COLOR PALETTE', d.palette));
  L.push(...row('COMPOSITION', d.comp));
  L.push(...row('DETAILS', d.details));
  if (vid) { L.push(...row('MOTION', d.motion)); L.push(...row('CAMERA MOVEMENT', d.camMove)); }
  L.push(...row('QUALITY', d.quality));
  if (d.refs.length) { L.push('', 'REFERENCES:'); d.refs.forEach(r => L.push(r)); }
  return L;
}

function buildNano(d, vid) {
  const L = [];
  if (d.subject) { L.push('SUBJECT:', d.subject, ''); }

function buildEdit(d) {
  const L = ['━━━ PHOTO EDITING PROMPT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━', ''];
  if (d.subject) { L.push('ORIGINAL PHOTO:', d.subject, ''); }
  if (d.eType.length) { L.push('EDIT TYPE:'); d.eType.forEach(e => L.push(`• ${e}`)); L.push(''); }
  if (d.eFrom.length) L.push('FROM (CURRENT STATE): '+d.eFrom.join(', '));
  if (d.eTo.length)   L.push('TO (DESIRED STATE): '+d.eTo.join(', '));
  if (d.eFrom.length||d.eTo.length) L.push('');
  if (d.intensity.length) { L.push('TRANSFORMATION INTENSITY: '+d.intensity.join(', ')); L.push(''); }
  if (d.preserve.length) { L.push('PRESERVE — DO NOT CHANGE:'); d.preserve.forEach(p => L.push(`• ${p}`)); L.push(''); }
  if (d.addl) { L.push('ADDITIONAL INSTRUCTIONS:', d.addl, ''); }
  const sfx = {
    'midjourney': 'Upload original image → use /blend or img2img\n--iw 0.5 --ar 16:9 --v 6.1',
    'stable-diff':'Mode: img2img   Denoising Strength: 0.5–0.75   CFG Scale: 7–12',
    'gpt-image':  'Attach the original image to the chat and paste this prompt.',
    'dalle3':     'Use DALL-E 3 inpainting or the Variations workflow.',
    'kling':      'Use Kling Image-to-Video with the original image as reference.',
    'flux':       'Mode: Flux img2img / Redux   Strength: 0.6–0.8',
  };
  if (sfx[currentModel]) { L.push('━━━ WORKFLOW ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'); L.push(sfx[currentModel]); }
  return L;
}

// ═══════════════════════════════════════════════════════════════════════
// COLORIZE
// ═══════════════════════════════════════════════════════════════════════
function colorize(lines) {
  return lines.map(line => {
    if (!line) return '';
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (/^━+/.test(line)) return `<span class="pe">${esc(line)}</span>`;
    if (/^--\w/.test(line.trim())) return `<span class="pp">${esc(line)}</span>`;
    if (line.startsWith('• ')) return `<span class="pb">${esc(line)}</span>`;
    const m = line.match(/^([A-Z][A-Z0-9 /&_]+:)(.*)/);
    if (m) return `<span class="pl">${esc(m[1])}</span><span class="pv">${esc(m[2])}</span>`;
    return `<span class="ps">${esc(line)}</span>`;
  }).join('\n');
}

// ═══════════════════════════════════════════════════════════════════════
// COPY
// ═══════════════════════════════════════════════════════════════════════
function toggleEditMode() {
  const out = document.getElementById('prompt-out');
  const ta  = document.getElementById('prompt-edit');
  const btn = document.getElementById('btn-edit-toggle');
  if (!manualEdit) {
    ta.value = out._raw || '';
    out.style.display = 'none';
    ta.style.display  = 'block';
    btn.classList.add('active');
    btn.title = 'Back to auto-generate';
    document.getElementById('char-count').textContent = ta.value.length + ' chars';
    manualEdit = true;
  } else {
    ta.style.display  = 'none';
    out.style.display = '';
    btn.classList.remove('active');
    btn.title = 'Manually edit the prompt';
    manualEdit = false;
    rebuild();
  }
}

function copyPrompt() {
  const ta  = document.getElementById('prompt-edit');
  const out = document.getElementById('prompt-out');
  const raw = manualEdit ? ta.value : (out._raw || '');
  if (!raw) return;
  navigator.clipboard.writeText(raw).then(() => {
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✓ Copied!'; btn.classList.add('copied');
    const t = document.getElementById('toast');
    t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200);
    setTimeout(() => { btn.textContent = 'Copy Prompt'; btn.classList.remove('copied'); }, 2000);
  });
}
