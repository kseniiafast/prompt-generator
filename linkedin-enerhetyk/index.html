<!-- ECOFACTOR × ЕНЕРГЕТИК — LinkedIn concept, 1080×1350 -->
<style>
  /* ---- Ruberoid (brand typeface) ---- */
  @font-face{font-family:'Ruberoid';src:url('assets/fonts/Ruberoid-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Ruberoid';src:url('assets/fonts/Ruberoid-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Ruberoid';src:url('assets/fonts/Ruberoid-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:'Ruberoid';src:url('assets/fonts/Ruberoid-Bold.woff2') format('woff2');font-weight:700;font-display:swap}

  :root{
    --green-60:#3AF185; --green-40:#23A859;
    --white:#FFFFFF; --gray-95:#F1F3F5; --gray-50:#7B7F84; --gray-20:#3A3A3A; --gray-10:#1F1F1F;
    --font:'Ruberoid','Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0c0c0c;font-family:var(--font);display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
  body{padding:24px}

  /* The exported canvas is EXACTLY 1080×1350. It is scaled down to fit the
     screen for preview via transform; export at 100% (see note at bottom). */
  .stage{width:1080px;height:1350px;transform-origin:top center}
  @media(max-width:1140px){ .stage{transform:scale(calc((100vw - 48px)/1080))} }

  .canvas{
    position:relative;width:1080px;height:1350px;overflow:hidden;
    background:var(--gray-10);border-radius:2px;
    font-family:var(--font);color:var(--white);
    isolation:isolate;
  }

  /* ---------- PHOTO LAYER (drop assets/stations.jpg here) ---------- */
  .photo{position:absolute;inset:0;z-index:0}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  /* Fallback dusk EV-charging scene shown until stations.jpg is added */
  .photo .scene{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 78% 22%, rgba(255,244,214,.85) 0%, rgba(255,236,190,.35) 22%, rgba(120,140,120,0) 46%),
      linear-gradient(180deg,#c9d2cf 0%,#b4c0ba 38%,#8fa393 60%,#6f8676 100%);
  }
  .photo .scene::before{ /* green charging pad ground */
    content:"";position:absolute;left:0;right:0;bottom:0;height:34%;
    background:linear-gradient(180deg,#5f7d5c 0%,#3f5a3d 100%);
    clip-path:polygon(0 22%,100% 0,100% 100%,0% 100%);
  }
  .photo .scene .stn{position:absolute;bottom:30%;width:120px;height:300px;border-radius:10px 10px 4px 4px;
    background:linear-gradient(180deg,#5a655c,#414b43);box-shadow:0 30px 60px rgba(0,0,0,.28)}
  .photo .scene .stn.a{right:20%;height:340px;bottom:29%}
  .photo .scene .stn.b{right:42%;height:250px;bottom:31%;opacity:.85;width:96px}
  .photo .scene .stn::after{content:"";position:absolute;top:34px;left:22px;right:22px;height:70px;border-radius:4px;background:#2b322c}

  /* ---------- SCRIMS ---------- */
  .scrim-top{position:absolute;left:0;right:0;top:0;height:360px;z-index:1;
    background:linear-gradient(180deg,rgba(15,15,15,.55) 0%,rgba(15,15,15,0) 100%)}
  .scrim-bot{position:absolute;left:0;right:0;bottom:0;height:820px;z-index:1;
    background:linear-gradient(180deg,rgba(15,15,15,0) 0%,rgba(17,17,17,.72) 46%,rgba(15,15,15,.96) 100%)}

  /* ---------- CONTENT GRID ---------- */
  .content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:64px}

  /* Top partner lockup (glass bar) */
  .partners{
    display:inline-flex;align-items:center;gap:32px;align-self:flex-start;
    padding:22px 32px;border-radius:16px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    box-shadow:0 8px 24px rgba(31,31,31,.14);
  }
  .partners .plabel{
    font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gray-50);writing-mode:vertical-rl;transform:rotate(180deg);
    border-right:none;padding-right:4px;
  }
  .partners .vrule{width:1px;height:56px;background:#D9DBDE}

  /* --- Recreated ЕНЕРГЕТИК wordmark (REPLACE with official logo) --- */
  .enerhetyk{display:inline-flex;align-items:center;font-weight:700;color:var(--gray-10);
    font-size:38px;letter-spacing:.01em;line-height:1}
  .enerhetyk .bolt{width:26px;height:40px;margin:0 -2px;display:inline-block}
  .enerhetyk .bolt path{fill:var(--green-40)}

  /* --- Recreated Global Compact Network Ukraine lockup (REPLACE) --- */
  .gcnu{display:inline-flex;align-items:center;gap:12px;color:var(--gray-20)}
  .gcnu .globe{width:44px;height:44px;flex:0 0 44px}
  .gcnu .globe path,.gcnu .globe circle,.gcnu .globe line{stroke:var(--gray-20);stroke-width:1.4;fill:none}
  .gcnu .gtxt{font-size:14px;font-weight:600;line-height:1.28;letter-spacing:.01em;max-width:190px}
  .gcnu .gtxt b{font-weight:700}
  .gcnu .gtxt span{color:var(--gray-50);font-weight:500}

  /* Green campaign chip */
  .chip{
    display:inline-flex;align-items:center;gap:10px;align-self:flex-start;
    padding:10px 20px;border-radius:9999px;background:var(--green-60);
    color:var(--gray-10);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;
  }
  .chip .dot{width:9px;height:9px;border-radius:9999px;background:var(--gray-10)}

  /* Bottom block */
  .bottom{display:flex;flex-direction:column;gap:32px}
  .ef-logo{width:300px;height:auto;display:block}
  .ef-logo svg{width:100%;height:auto;display:block}

  .headline{
    font-weight:700;letter-spacing:.03em;line-height:1.06;text-transform:uppercase;
    font-size:82px;color:var(--white);max-width:940px;
    text-shadow:0 2px 24px rgba(0,0,0,.35);
  }
  .headline .g{color:var(--green-60)}

  .accentline{width:120px;height:8px;border-radius:9999px;background:var(--green-60)}

  .footnote{font-size:16px;font-weight:500;letter-spacing:.02em;color:rgba(255,255,255,.72)}
  .footnote b{color:var(--white);font-weight:700}
</style>

<div class="stage">

    <!-- PHOTO: replace src with your real station photo (assets/stations.jpg) -->
    <div class="photo">
      <img src="assets/stations.jpg" alt=""
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">

        <div class="stn b"></div>
        <div class="stn a"></div>

    <div class="scrim-bot"></div>
